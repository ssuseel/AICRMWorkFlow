name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Validate database migrations
        env:
          DATABASE_URL: sqlite:////tmp/aicrm-ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
      - name: Prepare deployment smoke database
        env:
          DATABASE_URL: sqlite:////tmp/aicrm-deployment-smoke.db
        run: alembic upgrade head
      - name: Seed deployment smoke data
        env:
          DATABASE_URL: sqlite:////tmp/aicrm-deployment-smoke.db
        run: python -m sample_data.seed_demo
      - name: Verify deployment database
        env:
          DATABASE_URL: sqlite:////tmp/aicrm-deployment-smoke.db
        run: python -m scripts.deployment_smoke
